name: feasibility
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: kernel and uhid
        run: |
          uname -a
          sudo modprobe uhid || echo "modprobe uhid failed"
          ls -l /dev/uhid || echo "no /dev/uhid"
          grep -i uhid /lib/modules/$(uname -r)/modules.builtin || true
      - name: create a uhid device and enumerate it through hidapi
        run: |
          sudo apt-get install -y -qq libhidapi-hidraw0 >/dev/null
          sudo pip install --break-system-packages -q hid
          cat > /tmp/mk.py <<'PY'
          import os, struct, time, glob, hid
          fd = os.open('/dev/uhid', os.O_RDWR)
          # vendor usage page 0xFFA0, 64-byte input and output reports
          rd = bytes([0x06,0xA0,0xFF,0x09,0x01,0xA1,0x01,
                      0x09,0x03,0x15,0x00,0x26,0xFF,0x00,0x75,0x08,0x95,0x40,0x81,0x08,
                      0x09,0x04,0x15,0x00,0x26,0xFF,0x00,0x75,0x08,0x95,0x40,0x91,0x08,0xC0])
          UHID_CREATE2 = 11
          for i, pid in enumerate((0x5011, 0x5011)):
              f = os.open('/dev/uhid', os.O_RDWR) if i else fd
              name = f'Ledger Nano S Plus emulated {i}'.encode().ljust(128, b'\0')
              ev = (struct.pack('<I', UHID_CREATE2) + name + b''.ljust(64, b'\0') + f'{i:04d}'.encode().ljust(64, b'\0')
                    + struct.pack('<HHIIII', len(rd), 0x03, 0x2c97, pid, 0, 0) + rd.ljust(4096, b'\0'))
              os.write(f, ev)
          time.sleep(2)
          print('hidraw nodes:', glob.glob('/dev/hidraw*'))
          for d in hid.enumerate(0x2c97):
              print(hex(d['vendor_id']), hex(d['product_id']), d['path'], d.get('serial_number'), hex(d.get('usage_page', 0)))
          PY
          sudo python3 /tmp/mk.py
      - name: speculos image runs
        run: docker run --rm ghcr.io/ledgerhq/speculos --help | head -15
