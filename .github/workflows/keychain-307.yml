name: keychain-307
on:
  push:
  workflow_dispatch:
    inputs:
      repeat:
        type: number
        default: 1
jobs:
  run:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        commit: [4eec372, 8b9d328]
    env:
      COMMIT: ${{ matrix.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: caliperforge/solana-keychain
          path: keychain
          fetch-depth: 0
      - run: |
          git -C keychain fetch https://github.com/solana-foundation/solana-keychain cd5982c283e30328f1a0f13e754748633eb6bd06
          git -C keychain checkout --detach "${COMMIT%+claim}"
      - if: endsWith(matrix.commit, '+claim')
        run: |
          git -C keychain apply ../harness/keychain/patches/release-claim-before-reply-${COMMIT%+claim}.patch
          git -C keychain diff --quiet && { echo "no reply.send line changed" >&2; exit 1; }
          git -C keychain diff > "release-claim-${COMMIT%+claim}.patch"
          echo "BASE=${COMMIT%+claim}" >> "$GITHUB_ENV"
      - if: endsWith(matrix.commit, '+claim')
        uses: actions/upload-artifact@v4
        with:
          name: release-claim-${{ env.BASE }}.patch
          path: release-claim-${{ env.BASE }}.patch
      - run: sudo apt-get install -y -qq libudev-dev pkg-config strace
      - uses: dtolnay/rust-toolchain@stable
      - run: cp keychain/rust/Cargo.lock harness/keychain/
      - run: cargo build --release
        working-directory: harness/keychain
      - uses: ./
        id: rig
        with:
          count: 2
      - id: keys
        run: |
          "$RUNNER_TEMP/ledger-rig/bin/pip" install solders==0.27.0
          "$RUNNER_TEMP/ledger-rig/bin/python" - >> "$GITHUB_OUTPUT" <<'EOF'
          import hashlib
          from solders.keypair import Keypair
          from ledger_rig.seeds import SEEDS
          keys = []
          for mnemonic in SEEDS:
              seed = hashlib.pbkdf2_hmac("sha512", mnemonic.encode(), b"mnemonic", 2048)
              keypair = Keypair.from_seed_and_derivation_path(seed, "m/44'/501'/0'")
              keys.append(str(keypair.pubkey()))
          print("keys=" + " ".join(keys))
          EOF
      - env:
          KEYS: ${{ steps.keys.outputs.keys }}
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          bridge_logs="/tmp/ledger-rig/bridge-0000.log /tmp/ledger-rig/bridge-0001.log"
          sizes=$(stat -c %s $bridge_logs)
          last=
          until [ "$sizes" = "$last" ]; do
            [ "$SECONDS" -lt 60 ] || { echo "bridge logs still growing after 60 s" >&2; exit 1; }
            last=$sizes
            sleep 2
            sizes=$(stat -c %s $bridge_logs)
          done
          mkdir logs
          declare -A size
          for pass in $(seq "$REPEAT"); do
            hidraw=()
            for serial in 0000 0001; do
              node=$(grep -lx "HID_UNIQ=$serial" /sys/class/hidraw/*/device/uevent)
              node=${node%/device/uevent}
              hidraw+=("/dev/${node##*/}")
            done
            for scenario in A B C D E; do
              for serial in 0000 0001; do
                size[$serial]=$(stat -c %s "/tmp/ledger-rig/bridge-$serial.log" 2>/dev/null || echo 0)
              done
              status=0
              sudo strace -f -qq -e trace=openat -o "trace-$scenario" \
                harness/keychain/target/release/keychain-harness "$scenario" "$COMMIT" "${hidraw[@]}" $KEYS \
                > "line-$scenario" || status=$?
              for serial in 0000 0001; do
                tail -c +$((size[$serial] + 1)) "/tmp/ledger-rig/bridge-$serial.log" \
                  > "logs/bridge-$serial-$COMMIT-$scenario-$pass.log"
              done
              if [ ! -s "line-$scenario" ]; then
                jq -nc --arg commit "$COMMIT" --arg scenario "$scenario" --arg error "no result (exit $status)" \
                  '{$commit, $scenario, pass: false, $error, detail: $error}' > "line-$scenario"
              fi
              opens=$(grep -c '"/dev/hidraw' "trace-$scenario" || true)
              jq -c --argjson opens "$opens" '. + {hid_opens: $opens}' "line-$scenario" >> "results-$COMMIT.jsonl"
            done
          done
      - env:
          KEYS: ${{ steps.keys.outputs.keys }}
        run: |
          sudo "$RUNNER_TEMP/ledger-rig/bin/python" -m ledger_rig down
          while [ -e /tmp/ledger-rig/bridge-0000.sock ]; do
            [ "$SECONDS" -lt 60 ] || { echo "bridge-0000.sock still there after 60 s" >&2; exit 1; }
            sleep 1
          done
          hidraw=$(sudo "$RUNNER_TEMP/ledger-rig/bin/python" -m ledger_rig up --count 1 --locked --app "$RUNNER_TEMP"/apps/solana-nanosp-*.elf | cut -d' ' -f1)
          size=$(stat -c %s /tmp/ledger-rig/bridge-0000.log)
          status=0
          sudo env PATH="$RUNNER_TEMP/ledger-rig/bin:$PATH" \
            harness/keychain/target/release/keychain-harness F "$COMMIT" "$hidraw" - $KEYS > line-F || status=$?
          tail -c +$((size + 1)) /tmp/ledger-rig/bridge-0000.log > "logs/bridge-0000-$COMMIT-F.log"
          if [ ! -s line-F ]; then
            jq -nc --arg commit "$COMMIT" --arg error "no result (exit $status)" \
              '{$commit, scenario: "F", pass: false, $error, detail: $error}' > line-F
          fi
          cat line-F >> "results-$COMMIT.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.commit }}
          path: results-${{ matrix.commit }}.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-logs-${{ matrix.commit }}
          path: logs
  open-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: caliperforge/solana-keychain
          path: keychain
          fetch-depth: 0
      - run: |
          git -C keychain fetch https://github.com/solana-foundation/solana-keychain cd5982c283e30328f1a0f13e754748633eb6bd06
          git -C keychain checkout --detach cd5982c283e30328f1a0f13e754748633eb6bd06
      - run: sudo apt-get install -y -qq libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./
        with:
          count: 1
          dashboard: true
      - working-directory: keychain/rust
        run: |
          bin=$(cargo test --no-run --lib --no-default-features --features all,sdk-v3,unsafe-debug,integration-tests,ledger --message-format=json | jq -r 'select(.profile.test == true) | .executable')
          sudo "$bin" tests::test_ledger_integration::tests::test_ledger_integration_open_app --exact --ignored --nocapture | tee open-app.log
          grep -q 'test_ledger_integration_open_app ... ok' open-app.log
  table:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - run: |
          shopt -s nullglob
          jq -rs '
            def cell: tostring | gsub("\\|"; "\\|") | gsub("\n"; " ");
            "| commit | scenario | result | error | detail | wall ms | HID opens |",
            "|---|---|---|---|---|---|---|",
            (. as $rows | ("cd5982c", "aa66be2") as $c | ("A", "B", "C", "D", "E", "F") as $s
              | ($rows | map(select(.commit == $c and .scenario == $s)) | first) as $r
              | if $r == null then "| \($c) | \($s) | missing | | | | |"
                else "| \($c) | \($s) | \(if $r.pass then "pass" else "fail" end) | \($r.error // "" | cell) | \(($r.detail // "")[:200] | cell) | \($r.wall_ms // "") | \($r.hid_opens // "") |"
                end)
          ' /dev/null results/*.jsonl > results.md
          echo >> results.md
          jq -rs '
            def busy: .detail // "" | test("Ledger is busy|call 2 of 2 returned false");
            "| commit | runs | busy A | busy B | busy C | busy D | busy E (2× is_available, 1 device) | other failures |",
            "|---|---|---|---|---|---|---|---|",
            (. as $rows | ("cd5982c", "cd5982c+claim", "aa66be2", "aa66be2+claim") as $c
              | ($rows | map(select(.commit == $c and .scenario != "F" and (.pass | not)))) as $f
              | "| \($c) | \($rows | map(select(.commit == $c and .scenario == "A")) | length) | \([("A", "B", "C", "D", "E") as $s | $f | map(select(.scenario == $s and busy)) | length] | join(" | ")) | \($f | map(select(busy | not)) | length) |")
          ' /dev/null results/*.jsonl >> results.md
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.md
      - run: |
          cat results.md
          jq -se 'all(.[]; .pass or ((.detail // "") != ""))' results/*.jsonl
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            for scenario in A B C D E; do
              grep -Eq "^\| aa66be2 \| $scenario \| (pass|fail \|[^|]*\|[^|]*(Ledger is busy|call 2 of 2 returned false)[^|]*) \|" results.md
            done
            jq -se '[.[] | select(.scenario == "F")] | length == 4 and all(.pass)' results/*.jsonl
          fi
