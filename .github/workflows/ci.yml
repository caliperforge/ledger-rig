name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SOLANA_APP_TAG: af6ed454f0ed39cad8a5e1bca544ced18350a403
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        id: solana-app
        with:
          path: apps/solana-nanosp-${{ env.SOLANA_APP_TAG }}.elf
          key: solana-nanosp-${{ env.SOLANA_APP_TAG }}
      - if: steps.solana-app.outputs.cache-hit != 'true'
        run: bash scripts/build-solana-app.sh "$SOLANA_APP_TAG"
      - run: test "$(head -c 4 "apps/solana-nanosp-$SOLANA_APP_TAG.elf" | od -An -tx1 | tr -d ' \n')" = 7f454c46
      - run: pip install -e ".[test]" solders==0.27.0
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: sudo apt-get install -y -qq libhidapi-hidraw0
      - run: sudo modprobe uhid
      - run: sudo SOLANA_APP_TAG="$SOLANA_APP_TAG" "$(which python)" -m pytest -m uhid
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./post
        with:
          run: test -z "$(docker ps -q --filter label=ledger-rig)"
      - uses: ./
        id: rig
        with:
          count: 2
      - env:
          HIDRAW: ${{ steps.rig.outputs.hidraw }}
        run: |
          set -- $HIDRAW
          test $# -eq 2
          for path; do
            test -c "$path"
            test -r "$path" -a -w "$path"
          done
