[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger-rig"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest", "ruff", "hid", "pyyaml"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
markers = ["uhid: needs root and /dev/uhid"]
addopts = "-m 'not uhid'"
